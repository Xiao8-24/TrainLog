name: TrainLog Watch layout verification
on:
  push:
    branches: [codex/watch-qa-v061]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  watch-layout:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Record environment and unchanged release sources
        run: |
          mkdir -p artifacts/watch
          { git rev-parse HEAD; xcodebuild -version; xcrun simctl list runtimes; } > artifacts/watch/environment.txt
          git diff --exit-code f3955ee905a15c43c3269029408b7e48407f6434 -- TrainLogWatch Shared Packages/TrainLogCore TrainLog.xcodeproj
      - name: Build native Watch simulator app
        run: |
          set -o pipefail
          xcodebuild -project TrainLog.xcodeproj -scheme TrainLogWatch -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- build 2>&1 | tee artifacts/watch/build.log
      - name: Check runtime and capture actual native screens
        run: bash Tools/capture-watch-qa.sh
      - name: Preserve native Watch screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TrainLog-Watch-layout-v061
          path: artifacts/watch/
          if-no-files-found: error
          retention-days: 14
