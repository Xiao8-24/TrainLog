name: Android and Windows
on:
  push:
    paths:
      - 'CrossPlatform/**'
      - 'Tools/*cross*'
      - '.github/workflows/cross-platform.yml'
      - 'Packages/TrainLogCore/Sources/TrainLogCore/ExerciseCatalog.swift'
      - 'Packages/TrainLogCore/Sources/TrainLogCore/Domain.swift'
      - 'Packages/TrainLogCore/Sources/TrainLogCore/Cardio.swift'
  pull_request:
    paths:
      - 'CrossPlatform/**'
      - 'Tools/*cross*'
      - '.github/workflows/cross-platform.yml'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified Android and Windows preview packages
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  clients:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Record tools and generate catalog
        shell: bash
        run: |
          mkdir -p artifacts
          flutter --version > artifacts/flutter-version.txt
          git rev-parse HEAD > artifacts/source-commit.txt
          python Tools/generate_cross_catalog.py
          git diff --exit-code -- CrossPlatform/assets/catalog.json
      - name: Generate native runners
        working-directory: CrossPlatform
        run: flutter create --platforms=android,windows --project-name trainlog --org app.trainlog --no-pub .
      - name: Configure runners
        run: python Tools/bootstrap_cross_platform.py
      - name: Resolve dependencies
        working-directory: CrossPlatform
        run: flutter pub get
      - name: Analyze
        working-directory: CrossPlatform
        run: flutter analyze --no-fatal-infos
      - name: Apply TrainLog launcher icons
        working-directory: CrossPlatform
        run: dart run flutter_launcher_icons
      - name: Test records, timers, backup safety and adaptive UI
        working-directory: CrossPlatform
        run: flutter test --reporter expanded --timeout 2m
      - name: Build Android preview APKs
        if: runner.os == 'Linux'
        working-directory: CrossPlatform
        run: flutter build apk --release --split-per-abi
      - name: Check APK signing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in CrossPlatform/build/app/outputs/flutter-apk/*-release.apk; do "$apksigner" verify --verbose --print-certs "$apk"; done
      - name: Build Windows
        if: runner.os == 'Windows'
        working-directory: CrossPlatform
        run: flutter build windows --release
      - name: Package Android
        if: runner.os == 'Linux'
        run: python Tools/package_cross_platform.py --platform android
      - name: Package Windows and VC++ runtime
        if: runner.os == 'Windows'
        run: python Tools/package_cross_platform.py --platform windows
      - name: Preserve diagnostics and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-diagnostics-${{ runner.os }}-${{ github.run_number }}
          path: |
            artifacts/*.txt
            artifacts/cross-backup-fixture.json
            CrossPlatform/pubspec.lock
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: TrainLog-${{ runner.os }}-${{ github.run_number }}
          path: artifacts/cross-delivery/
          if-no-files-found: error
  backup-interop:
    needs: clients
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cross-diagnostics-Linux-${{ github.run_number }}
          path: .
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Compile actual native backup decoder
        run: swiftc -parse-as-library Packages/TrainLogCore/Sources/TrainLogCore/*.swift Tools/cross_backup_interop.swift -o artifacts/cross-interop
      - name: Validate Dart export using Swift
        run: artifacts/cross-interop validate artifacts/cross-backup-fixture.json artifacts/cross-backup-native.json
      - name: Generate Swift backup
        run: artifacts/cross-interop generate unused artifacts/native-fixture.json
      - name: Verify native backup round trip through Dart database
        working-directory: CrossPlatform
        env:
          CROSS_NATIVE_FIXTURE: ../artifacts/native-fixture.json
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/interop_test.dart --reporter expanded --timeout 2m
      - name: Validate returned backup using Swift
        run: artifacts/cross-interop validate artifacts/native-roundtrip.json artifacts/native-roundtrip-validated.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-backup-interop-${{ github.run_number }}
          path: artifacts/*.json
  publish:
    if: inputs.publish || (github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release cross v0.10.0'))
    needs: [clients, backup-interop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TrainLog-*
          path: delivery
          merge-multiple: true
      - name: Package tested source and checksums
        run: |
          git archive --format=zip HEAD -o delivery/TrainLog-v0.10.0-source.zip
          cp Documentation/CROSS_PLATFORM.md delivery/README.md
          cd delivery
          sha256sum *.zip *.apk README.md > SHA256SUMS.txt
      - name: Publish preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.10.0 --target "$GITHUB_SHA" --prerelease --title 'TrainLog v0.10.0 · Android & Windows 预览版' --notes-file Documentation/CROSS_PLATFORM.md delivery/*
