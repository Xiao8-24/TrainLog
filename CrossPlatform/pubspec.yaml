name: trainlog
description: Offline TrainLog clients for Android and Windows.
publish_to: none
version: 0.10.0+15
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite3: ^3.8.0
  path_provider: ^2.1.5
  file_selector: ^1.1.0
  uuid: ^4.5.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../TrainLog/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
  min_sdk_android: 24
  windows:
    generate: true
    image_path: ../TrainLog/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon.png
    icon_size: 256
